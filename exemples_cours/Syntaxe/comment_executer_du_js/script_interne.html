<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page HTML minimale</title>
  <style>
    body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial; padding: 2rem; }
    button { padding: .5rem 1rem; font-size: 1rem; }
  </style>
</head>
<body>
  <h1>Exemple HTML minimal</h1>
  <p id="msg">Clique sur le bouton pour incrémenter le compteur :</p>
  <button id="btn">0</button>

  <script>
    (function () {
      const btn = document.getElementById('btn');
      const msg = document.getElementById('msg');
      let count = 0;

      btn.addEventListener('click', function () {
        count += 1;
        btn.textContent = count;
        msg.textContent = `Tu as cliqué ${count} fois.`;
        console.log('clic n°', count);
      });
    })();
  </script>
</body>
</html>
